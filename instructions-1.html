<style>
    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        background: #000;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        background:
            radial-gradient(
                circle at top,
                #2a2108 0%,
                #100d05 30%,
                #050505 65%,
                #000 100%
            );

        color: #fff;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
    }

    .container {
        width: 100%;
        max-width: 520px;
        text-align: center;
    }

    .logo {
        margin: 0 0 20px;
        font-size: clamp(32px, 8vw, 48px);
        font-weight: 900;
        letter-spacing: -2px;

        background:
            linear-gradient(
                135deg,
                #fff4b0 0%,
                #ffd75a 20%,
                #c99419 45%,
                #fff0a0 65%,
                #b77b08 85%,
                #ffe27a 100%
            );

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        filter:
            drop-shadow(0 0 12px rgba(255, 204, 60, 0.18))
            drop-shadow(0 0 30px rgba(255, 190, 30, 0.08));
    }

    .language-switcher {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 28px;
    }

    .lang-btn {
        border: 1px solid rgba(218, 168, 35, 0.28);
        background: rgba(255, 255, 255, 0.025);
        color: #8e8e8e;

        padding: 6px 12px;
        border-radius: 8px;

        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;

        cursor: pointer;
        transition:
            color 0.2s ease,
            border-color 0.2s ease,
            background 0.2s ease;
    }

    .lang-btn:hover {
        color: #e4bd50;
        border-color: rgba(218, 168, 35, 0.55);
    }

    .lang-btn.active {
        color: #000;
        background:
            linear-gradient(
                135deg,
                #fff0a0,
                #dca82b
            );
        border-color: #e2b43c;
    }

    .instruction-box {
        padding: 24px;
        margin-bottom: 28px;

        border: 1px solid rgba(218, 168, 35, 0.3);
        border-radius: 14px;

        background: rgba(255, 255, 255, 0.025);
        text-align: left;
    }

    .instruction-text {
        color: #e4bd50;
        font-size: 15px;
        line-height: 1.7;
        font-weight: 500;
    }

    .instruction-text p {
        margin: 0 0 14px;
    }

    .instruction-text p:last-child {
        margin-bottom: 0;
    }

    .back-button {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        min-height: 50px;

        padding: 14px 24px;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #fff0a0 0%,
                #ffd34f 22%,
                #c28a14 52%,
                #f5d66b 76%,
                #b77c0b 100%
            );

        color: #090909;
        text-decoration: none;

        font-size: 15px;
        font-weight: 800;

        box-shadow:
            0 8px 24px rgba(205, 157, 36, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.5);

        transition:
            transform 0.2s ease,
            filter 0.2s ease;
    }

    .back-button:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
    }

    footer {
        margin-top: 36px;
        color: #555;
        font-size: 11px;
        letter-spacing: 0.4px;
    }

<main class="container">

    <h1 class="logo">WT419 VPN</h1>

    <div class="language-switcher">
        <button class="lang-btn active" data-lang="ru" type="button" onclick="setLanguage('ru')">
            RU
        </button>
        <button class="lang-btn" data-lang="en" type="button" onclick="setLanguage('en')">
            EN
        </button>
    </div>

    <div class="instruction-box">
        <div class="instruction-text" id="instruction-content">
            <!-- Текст загружается через JS -->
        </div>
    </div>

    <a href="index.html" class="back-button" id="back-btn">
        На главную
    </a>

    <footer>
        WT419 VPN
    </footer>

</main>

<script>
    const translations = {
        ru: {
            content: `
                <p>📦 <b>Шаг 1.</b> Установите приложение <b>Happ</b> из Google Play, AppStore или с GitHub (для Windows и Linux).</p>
                <p>⚡ <b>Шаг 2.</b> Нажмите на главной странице кнопку <b>«Подключить через Happ»</b> — конфигурация добавится в приложение автоматически.</p>
                <p>🚀 <b>Шаг 3.</b> Выберите доступную локацию и нажмите кнопку подключения в клиенте. Приятного пользования!</p>
            `,
            back: "На главную"
        },
        en: {
            content: `
                <p>📦 <b>Step 1.</b> Install the <b>Happ</b> app from Google Play, AppStore, or GitHub (for Windows and Linux).</p>
                <p>⚡ <b>Step 2.</b> Click the <b>«Connect with Happ»</b> button on the main page — the configuration will be added automatically.</p>
                <p>🚀 <b>Step 3.</b> Select an available location and click the connect button in the client. Enjoy!</p>
            `,
            back: "Back to Home"
        }
    };

    function setLanguage(lang) {
        const t = translations[lang];

        document.documentElement.lang = lang;
        document.getElementById("instruction-content").innerHTML = t.content;
        document.getElementById("back-btn").textContent = t.back;

        document.querySelectorAll(".lang-btn").forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.lang === lang
            );
        });
    }

    setLanguage("ru");
</script>

</body>
